name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: STATIC_EXPORT=true npx next build
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/

  deploy:
    # Deploy only on pushes to main (not on PRs). workflow_dispatch on main also deploys.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out/
      - name: Deploy static export to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./public_html/
          # Never wipe the server dir: the PHP backend (api/, account/,
          # checkout/, tools/) and other server-managed files must survive.
          dangerous-clean-slate: false
