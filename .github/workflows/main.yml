name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: STATIC_EXPORT=true npx next build
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/

  deploy:
    # Deploy only on pushes to main (not on PRs). workflow_dispatch on main also deploys.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out/
      - name: Pack static export
        run: |
          tar -czf site.tar.gz -C out .
          echo "=== out/ contents ==="
          ls -la out | head -30
          echo "=== tarball contents ==="
          tar -tzf site.tar.gz | head -30
      - name: Copy archive to server over SSH
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 65002
          source: "site.tar.gz"
          target: "~/"
      - name: Extract into public_html
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 65002
          script: |
            set -e
            mkdir -p ~/public_html
            tar -xzf ~/site.tar.gz -C ~/public_html
            rm -f ~/site.tar.gz
            # Safety net: the web server needs 755 on dirs and 644 on files.
            find ~/public_html -type d -exec chmod 755 {} +
            find ~/public_html -type f -exec chmod 644 {} +
            echo "=== public_html after deploy ==="
            ls -la ~/public_html | head -40
            echo "=== key files ==="
            ls -la ~/public_html/index.html ~/public_html/checkout ~/public_html/api/usage.php 2>&1
            echo "Deployed OK"
